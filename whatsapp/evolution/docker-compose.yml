# Evolution API v2 (Baileys mode) + Postgres + Redis. Run from this folder: cp .env.example .env && docker compose up
services:
  api:
    image: evoapicloud/evolution-api:latest  # ponytail: pin a tag before production
    restart: unless-stopped
    ports: ["8080:8080"]
    env_file: .env
    volumes: [evolution_instances:/evolution/instances]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
volumes:
  evolution_instances:
  postgres_data:
  redis_data:
